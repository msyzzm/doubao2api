name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      # Lint only. `ruff format --check` used to run here, but the code is
      # hand-wrapped — comment placement and line breaks carry intent — and
      # satisfying the formatter would mean a 4000-line mechanical rewrite that
      # buries the history without catching a single real defect.
      - name: Lint
        run: ruff check doubao2api/
